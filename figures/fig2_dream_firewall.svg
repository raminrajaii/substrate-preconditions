<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 372" width="624" height="372" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 2. The dream firewall</title><desc id="d">Grounded memory on the left (messages, fact rows, images and receipts, each tracing to a source) feeds a turn and is the only ground of the claim checker. The dream lane on the right sits in a separate database schema the API layer does not serve: two cycles at the snapshot, $0.0034 per cycle. Between them a build gate fails the deploy on any unauthorized reference to the dream lane from grounded code. Two channels cross into a turn through a class allowlist at the fetch that fails closed: residue, pushed, one flagged line rendered last before the message list; and recall, pulled, a tool called on purpose on the primary path only. The contamination canary is runnable now and unrun.</desc><rect width="624" height="372" fill="#FFFFFF"/><defs><marker id="ah-slate" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4A5162"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#7D8494"/></marker><marker id="ah-checker" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#C8216A"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4B2BD4"/></marker><marker id="ah-me" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#D9622B"/></marker></defs><text x="16.0" y="22.0" font-size="8.6" fill="#4A5162" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">GROUNDED MEMORY</text><text x="312.0" y="22.0" font-size="8.6" fill="#15171D" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">BUILD GATE</text><text x="608.0" y="22.0" font-size="8.6" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">THE DREAM LANE</text><rect x="16.0" y="34.0" width="246.0" height="82.0" rx="7" ry="7" fill="#FFFFFF" stroke="#4A5162" stroke-width="1.1"/><text x="28.0" y="58.0" font-size="9.6" fill="#15171D" font-weight="500" text-anchor="start">messages, fact rows, images, receipts</text><text x="28.0" y="76.0" font-size="9.2" fill="#4A5162" font-weight="400" text-anchor="start">each one traces to a source</text><rect x="16.0" y="152.0" width="180.0" height="50.0" rx="7" ry="7" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.3"/><text x="28.0" y="172.0" font-size="9.6" fill="#C8216A" font-weight="600" text-anchor="start">the claim checker</text><text x="28.0" y="190.0" font-size="9.2" fill="#4A5162" font-weight="400" text-anchor="start">never sees the dream lane</text><line x1="76.0" y1="116.0" x2="76.0" y2="150.0" stroke="#4A5162" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-slate)"/><text x="84.0" y="138.0" font-size="8.6" fill="#7D8494" font-weight="400" text-anchor="start">the claim checker&#x27;s only ground</text><rect x="362.0" y="34.0" width="246.0" height="82.0" rx="7" ry="7" fill="#FFFFFF" stroke="#4B2BD4" stroke-width="1.3"/><text x="374.0" y="58.0" font-size="9.6" fill="#15171D" font-weight="500" text-anchor="start">a separate database schema,</text><text x="374.0" y="76.0" font-size="9.2" fill="#4A5162" font-weight="400" text-anchor="start">not served by the API layer</text><text x="374.0" y="102.0" font-size="8.2" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">2 cycles · $0.0034 per cycle</text><line x1="312.0" y1="34.0" x2="312.0" y2="232.0" stroke="#15171D" stroke-width="2.4" stroke-linecap="butt"/><rect x="303.0" y="62" width="18" height="22" fill="#FFFFFF"/><g transform="translate(307.0,64.0) scale(1.0)"><path d="M2.4,5.2 V3.6 a2.6,2.6 0 0 1 5.2,0 V5.2" fill="none" stroke="#15171D" stroke-width="1.25"/><rect x="0.6" y="5.2" width="8.8" height="6.4" rx="1.4" fill="#15171D"/><circle cx="5" cy="8.2" r="1" fill="#FFFFFF"/></g><rect x="266.9" y="94" width="90.2" height="38" fill="#FFFFFF"/><text x="312.0" y="104.0" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="middle">fails the deploy</text><text x="312.0" y="115.5" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="middle">on any unauthorized</text><text x="312.0" y="127.0" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="middle">reference</text><rect x="16.0" y="262.0" width="454.0" height="56.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1.1"/><text x="28.0" y="254.0" font-size="8.6" fill="#4A5162" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">ONE TURN</text><line x1="300.0" y1="270.0" x2="300.0" y2="310.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><text x="26.0" y="293.5" font-size="9.2" fill="#4A5162" font-weight="500" text-anchor="start">every block of real context</text><text x="310.0" y="287.0" font-size="9.2" fill="#4B2BD4" font-weight="500" text-anchor="start">residue: one flagged line,</text><text x="310.0" y="300.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">just before the message list</text><rect x="486.0" y="262.0" width="122.0" height="56.0" rx="7" ry="7" fill="#FFFFFF" stroke="#4B2BD4" stroke-width="1.1" stroke-dasharray="3 2.5"/><text x="496.0" y="287.0" font-size="9.2" fill="#4B2BD4" font-weight="500" text-anchor="start">a recall</text><text x="496.0" y="300.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">marked as unreal</text><path d="M236.0,116 L236.0,260.0" fill="none" stroke="#4A5162" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-slate)"/><path d="M392.0,116 L392.0,260.0" fill="none" stroke="#4B2BD4" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#ah-agent)"/><path d="M560.0,116 L560.0,260.0" fill="none" stroke="#4B2BD4" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-agent)"/><line x1="385.0" y1="214.0" x2="399.0" y2="214.0" stroke="#15171D" stroke-width="2" stroke-linecap="round"/><line x1="553.0" y1="214.0" x2="567.0" y2="214.0" stroke="#15171D" stroke-width="2" stroke-linecap="round"/><text x="400.0" y="150.0" font-size="9.2" fill="#4B2BD4" font-weight="600" text-anchor="start">push</text><text x="400.0" y="163.0" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="start">rendered last</text><text x="552.0" y="150.0" font-size="9.2" fill="#4B2BD4" font-weight="600" text-anchor="end">pull</text><text x="552.0" y="163.0" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="end">a tool it calls</text><text x="552.0" y="174.5" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="end">on purpose,</text><text x="552.0" y="186.0" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="end">primary path only</text><text x="476.0" y="232.0" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="middle">class allowlist at the fetch</text><text x="16.0" y="358.0" font-size="8.4" fill="#C8216A" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">the contamination canary: runnable now, unrun</text></svg>