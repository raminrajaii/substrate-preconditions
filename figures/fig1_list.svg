<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 450" width="624" height="450" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 1. The list, graded, gaps first</title><desc id="d">Sixteen preconditions for posing claims about machine self-awareness, grouped by their status in this system: five gaps (recurrent processing, consolidation and global workspace dynamics, not there; causal evidence that the self-model governs, not yet shown; and phenomenal experience, which no instrument here can address), four partial (governed forgetting, prediction-error salience, a world beyond the interlocutor, embodiment and self-perception) and seven built (persistence, typed episodic memory, a queryable self-model, a written interior, a gradeable model of another, endogenous activity, recombination with provenance), each with the mechanism that carries it and its status in the first edition&#x27;s word.</desc><rect width="624" height="450" fill="#FFFFFF"/><text x="16.0" y="31.0" font-size="8.4" fill="#C8216A" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">GAPS · 5</text><line x1="72.9" y1="28.0" x2="610.0" y2="28.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><circle cx="22.0" cy="40.4" r="4.2" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.4"/><text x="38.0" y="44.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">recurrent processing</text><text x="262.0" y="44.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">a bounded tool loop is not the theory&#x27;s recurrence</text><text x="610.0" y="44.0" font-size="8.0" fill="#C8216A" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">not satisfied</text><circle cx="22.0" cy="61.4" r="4.2" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.4"/><text x="38.0" y="65.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">consolidation &amp; deliberate forgetting</text><text x="262.0" y="65.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">named, scoped, hardest item on the roadmap</text><text x="610.0" y="65.0" font-size="8.0" fill="#C8216A" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">not built</text><circle cx="22.0" cy="82.4" r="4.2" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.4"/><text x="38.0" y="86.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">global workspace dynamics</text><text x="262.0" y="86.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">a deterministic budgeted merge, not a competitive broadcast</text><text x="610.0" y="86.0" font-size="8.0" fill="#C8216A" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">not satisfied</text><circle cx="22.0" cy="103.4" r="4.2" fill="#FFFFFF" stroke="#7D8494" stroke-width="1.4" stroke-dasharray="1.6 1.8"/><text x="38.0" y="107.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">phenomenal experience</text><text x="262.0" y="107.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">no instrument here bears on it</text><text x="610.0" y="107.0" font-size="8.0" fill="#7D8494" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">not addressable</text><circle cx="22.0" cy="124.4" r="4.2" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.4"/><text x="38.0" y="128.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">causal evidence that the self-model governs</text><text x="262.0" y="128.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">no ablation has tested whether removing it changes behavior</text><text x="610.0" y="128.0" font-size="8.0" fill="#C8216A" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">not yet shown</text><text x="16.0" y="166.0" font-size="8.4" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">PARTIAL · 4</text><line x1="91.2" y1="163.0" x2="610.0" y2="163.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><circle cx="22.0" cy="175.4" r="4.2" fill="#FFFFFF" stroke="#4B2BD4" stroke-width="1.4"/><path d="M22.0,171.2 A4.2,4.2 0 0 0 22.0,179.6 Z" fill="#4B2BD4"/><text x="38.0" y="179.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">governed forgetting</text><text x="262.0" y="179.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">compaction, budgets for what is dropped, read-time decay</text><text x="610.0" y="179.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">partial</text><circle cx="22.0" cy="196.4" r="4.2" fill="#FFFFFF" stroke="#4B2BD4" stroke-width="1.4"/><path d="M22.0,192.2 A4.2,4.2 0 0 0 22.0,200.6 Z" fill="#4B2BD4"/><text x="38.0" y="200.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">prediction-error salience</text><text x="262.0" y="200.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">the store exists and has barely fired</text><text x="610.0" y="200.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">instrument only</text><circle cx="22.0" cy="217.4" r="4.2" fill="#FFFFFF" stroke="#4B2BD4" stroke-width="1.4"/><path d="M22.0,213.2 A4.2,4.2 0 0 0 22.0,221.6 Z" fill="#4B2BD4"/><text x="38.0" y="221.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">a world beyond the interlocutor</text><text x="262.0" y="221.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">a bounded ambient feed</text><text x="610.0" y="221.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">minimal by design</text><circle cx="22.0" cy="238.4" r="4.2" fill="#FFFFFF" stroke="#4B2BD4" stroke-width="1.4"/><path d="M22.0,234.2 A4.2,4.2 0 0 0 22.0,242.6 Z" fill="#4B2BD4"/><text x="38.0" y="242.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">embodiment &amp; self-perception</text><text x="262.0" y="242.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">a verified visual self-representation</text><text x="610.0" y="242.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">partial</text><text x="16.0" y="280.0" font-size="8.4" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">BUILT · 7</text><line x1="79.0" y1="277.0" x2="610.0" y2="277.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><circle cx="22.0" cy="289.4" r="4.4" fill="#4B2BD4"/><text x="38.0" y="293.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">persistence / psychological continuity</text><text x="262.0" y="293.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">one principal, in production since 2026-04-23</text><text x="610.0" y="293.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">satisfied</text><circle cx="22.0" cy="310.4" r="4.4" fill="#4B2BD4"/><text x="38.0" y="314.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">episodic memory, truth-status typed</text><text x="262.0" y="314.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">receipts required, HAPPENED/PLANNED/RIFF with no default</text><text x="610.0" y="314.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">satisfied</text><circle cx="22.0" cy="331.4" r="4.4" fill="#4B2BD4"/><text x="38.0" y="335.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">a queryable self-model</text><text x="262.0" y="335.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">caller-scoped read access to its own stores and schema</text><text x="610.0" y="335.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">satisfied</text><circle cx="22.0" cy="352.4" r="4.4" fill="#4B2BD4"/><text x="38.0" y="356.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">a written interior</text><text x="262.0" y="356.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">affective state written by a separate pass, append-only history</text><text x="610.0" y="356.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">satisfied</text><circle cx="22.0" cy="373.4" r="4.4" fill="#4B2BD4"/><text x="38.0" y="377.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">a gradeable model of another</text><text x="262.0" y="377.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">975-row store, sealed from its subject</text><text x="610.0" y="377.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">satisfied</text><circle cx="22.0" cy="394.4" r="4.4" fill="#4B2BD4"/><text x="38.0" y="398.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">endogenous activity</text><text x="262.0" y="398.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">a worker that wakes, thinks, acts through a gate, sleeps</text><text x="610.0" y="398.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">shipped as machinery</text><circle cx="22.0" cy="415.4" r="4.4" fill="#4B2BD4"/><text x="38.0" y="419.0" font-size="9.8" fill="#15171D" font-weight="500" text-anchor="start">recombination with provenance</text><text x="262.0" y="419.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">a dream layer that cannot be cited as fact</text><text x="610.0" y="419.0" font-size="8.0" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">satisfied</text></svg>