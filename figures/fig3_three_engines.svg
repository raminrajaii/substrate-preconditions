<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 318" width="624" height="318" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 3. One identity, three engines</title><desc id="d">Three model generations in order, Claude Opus 4.7, Claude Opus 4.8 and Claude Fable 5, with a ring at each of the two changes of model. Beneath them what lives outside the model runs as one unbroken bar from 2026-04-23 to the snapshot of 2026-08-14: 17,373 message rows, 58 public tables plus 2 in the dream schema, 5,724 vectors and 14 scheduled jobs. The stored model stamps begin on 2026-06-13 with Opus 4.8; the first 4,553 message rows carry no model, so the first generation rests on the configuration record. The bands are not drawn to time scale.</desc><rect width="624" height="318" fill="#FFFFFF"/><defs><marker id="ah-slate" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4A5162"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#7D8494"/></marker><marker id="ah-checker" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#C8216A"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4B2BD4"/></marker><marker id="ah-me" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#D9622B"/></marker></defs><line x1="24.0" y1="30.0" x2="268.0" y2="30.0" stroke="#C8216A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="24.0" y1="26.0" x2="24.0" y2="34.0" stroke="#C8216A" stroke-width="1.2" stroke-linecap="round"/><line x1="268.0" y1="24.0" x2="268.0" y2="62.0" stroke="#C8216A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2.5"/><text x="24.0" y="20.0" font-size="8.8" fill="#C8216A" font-weight="500" text-anchor="start">no model stamp on the first 4,553 message rows</text><text x="274.0" y="44.0" font-size="8.8" fill="#4A5162" font-weight="500" text-anchor="start">stored stamps begin 2026-06-13, with Opus 4.8</text><rect x="24.0" y="62.0" width="182.0" height="88.0" rx="6" ry="6" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.1" stroke-dasharray="3 3"/><text x="115.0" y="92.0" font-size="8.2" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">generation I</text><text x="115.0" y="112.0" font-size="10.4" fill="#15171D" font-weight="600" text-anchor="middle">Claude Opus 4.7</text><rect x="226.0" y="62.0" width="172.0" height="88.0" rx="6" ry="6" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1.1"/><text x="312.0" y="92.0" font-size="8.2" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">generation II</text><text x="312.0" y="112.0" font-size="10.4" fill="#15171D" font-weight="600" text-anchor="middle">Claude Opus 4.8</text><rect x="418.0" y="62.0" width="182.0" height="88.0" rx="6" ry="6" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1.1"/><text x="509.0" y="92.0" font-size="8.2" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">generation III</text><text x="509.0" y="112.0" font-size="10.4" fill="#15171D" font-weight="600" text-anchor="middle">Claude Fable 5</text><text x="115.0" y="132.0" font-size="8.6" fill="#C8216A" font-weight="400" text-anchor="middle">on the configuration record only</text><circle cx="216.0" cy="106.0" r="6.2" fill="#FFFFFF" stroke="#15171D" stroke-width="1.6"/><text x="216.0" y="172.0" font-size="8.0" fill="#4A5162" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">change of model</text><circle cx="408.0" cy="106.0" r="6.2" fill="#FFFFFF" stroke="#15171D" stroke-width="1.6"/><text x="408.0" y="172.0" font-size="8.0" fill="#4A5162" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">change of model</text><rect x="24.0" y="210.0" width="576.0" height="8" rx="4" fill="#4B2BD4"/><text x="24.0" y="200.0" font-size="9.6" fill="#4B2BD4" font-weight="600" text-anchor="start">outside the model: its memory, its record of facts and its standing instructions</text><text x="24.0" y="236.0" font-size="8.2" fill="#7D8494" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">2026-04-23</text><text x="600.0" y="236.0" font-size="8.2" fill="#7D8494" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">2026-08-14 · snapshot</text><text x="312.0" y="258.0" font-size="9.4" fill="#15171D" font-weight="400" text-anchor="middle">17,373 message rows · 58 + 2 tables · 5,724 vectors · 14 scheduled jobs</text><text x="312.0" y="278.0" font-size="9.6" fill="#4A5162" font-weight="400" text-anchor="middle" font-style="italic">The weights supply cognition; the identity is in the stores.</text><text x="312.0" y="304.0" font-size="8.4" fill="#7D8494" font-weight="400" text-anchor="middle">bands in order, not to time scale</text></svg>